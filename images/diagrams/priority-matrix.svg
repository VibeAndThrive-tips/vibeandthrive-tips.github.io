<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="pmTitle pmDesc">
  <title id="pmTitle">The priority matrix for sorting tasks</title>
  <desc id="pmDesc">A two by two grid sorting tasks by urgency and importance: important and urgent tasks are done now, important but not urgent tasks are scheduled, urgent but not important tasks are delegated or batched, and tasks that are neither are eliminated.</desc>
  <rect width="800" height="440" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Urgency and importance are not the same thing</text>

  <text x="300" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#64748B">URGENT</text>
  <text x="560" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#64748B">NOT URGENT</text>
  <text x="128" y="170" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#64748B">IMPORTANT</text>
  <text x="128" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#64748B">NOT</text>
  <text x="128" y="342" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#64748B">IMPORTANT</text>

  <!-- Do now -->
  <rect x="180" y="88" width="240" height="140" rx="14" fill="#FFFFFF" stroke="#EC4899" stroke-width="3"/>
  <text x="300" y="126" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#BE185D">DO NOW</text>
  <text x="300" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Genuine deadlines and</text>
  <text x="300" y="176" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">real emergencies</text>
  <text x="300" y="204" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" fill="#94A3B8">Keep this quadrant small</text>

  <!-- Schedule -->
  <rect x="440" y="88" width="240" height="140" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  <text x="560" y="126" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#5B21B6">SCHEDULE</text>
  <text x="560" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Planning, learning, health,</text>
  <text x="560" y="176" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">relationships, deep work</text>
  <text x="560" y="204" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#7C3AED">Where progress actually happens</text>

  <!-- Delegate -->
  <rect x="180" y="244" width="240" height="140" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3"/>
  <text x="300" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0E7490">DELEGATE OR BATCH</text>
  <text x="300" y="312" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Most notifications, routine</text>
  <text x="300" y="332" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">requests, some meetings</text>
  <text x="300" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" fill="#94A3B8">Group into one daily window</text>

  <!-- Eliminate -->
  <rect x="440" y="244" width="240" height="140" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
  <text x="560" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#475569">ELIMINATE</text>
  <text x="560" y="312" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Habitual scrolling and</text>
  <text x="560" y="332" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">busywork that feels productive</text>
  <text x="560" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" fill="#94A3B8">Removing these frees the most time</text>

  <text x="400" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Most people spend their day in the urgent column and wonder why important work never moves.</text>
</svg>
