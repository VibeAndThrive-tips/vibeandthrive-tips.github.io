<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="tpTitle tpDesc">
  <title id="tpTitle">The five stages of planning a trip</title>
  <desc id="tpDesc">Five planning stages in order: choose a destination that fits your budget, set the budget, book the large fixed costs such as flights and accommodation, plan days loosely, and complete a pre-departure checklist covering documents and insurance.</desc>
  <rect width="800" height="360" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Each stage narrows the decisions in the next</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif">
    <rect x="44" y="82" width="140" height="138" rx="14" fill="#7C3AED"/>
    <text x="114" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
    <text x="114" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Destination</text>
    <text x="114" y="176" text-anchor="middle" font-size="11" fill="#DDD6FE">Season, visa rules,</text>
    <text x="114" y="192" text-anchor="middle" font-size="11" fill="#DDD6FE">realistic cost</text>

    <rect x="196" y="82" width="140" height="138" rx="14" fill="#6D28D9"/>
    <text x="266" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
    <text x="266" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Budget</text>
    <text x="266" y="176" text-anchor="middle" font-size="11" fill="#EDE9FE">Total figure and a</text>
    <text x="266" y="192" text-anchor="middle" font-size="11" fill="#EDE9FE">daily allowance</text>

    <rect x="348" y="82" width="140" height="138" rx="14" fill="#06B6D4"/>
    <text x="418" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
    <text x="418" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Big logistics</text>
    <text x="418" y="176" text-anchor="middle" font-size="11" fill="#ECFEFF">Flights and stays</text>
    <text x="418" y="192" text-anchor="middle" font-size="11" fill="#ECFEFF">anchor everything</text>

    <rect x="500" y="82" width="140" height="138" rx="14" fill="#F97316"/>
    <text x="570" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
    <text x="570" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Plan days loosely</text>
    <text x="570" y="176" text-anchor="middle" font-size="11" fill="#FFF7ED">One anchor per day,</text>
    <text x="570" y="192" text-anchor="middle" font-size="11" fill="#FFF7ED">not a full schedule</text>

    <rect x="652" y="82" width="140" height="138" rx="14" fill="#10B981"/>
    <text x="722" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text>
    <text x="722" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Pre-departure</text>
    <text x="722" y="176" text-anchor="middle" font-size="11" fill="#ECFDF5">Documents, insurance,</text>
    <text x="722" y="192" text-anchor="middle" font-size="11" fill="#ECFDF5">copies, payments</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M188 151 h4"/><path d="M340 151 h4"/><path d="M492 151 h4"/><path d="M644 151 h4"/>
  </g>

  <text x="400" y="274" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Booking before setting a budget is the most common way trips drift over what you intended to spend.</text>
  <text x="400" y="316" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Check passport validity early &#183; Many countries require six months remaining</text>
</svg>
