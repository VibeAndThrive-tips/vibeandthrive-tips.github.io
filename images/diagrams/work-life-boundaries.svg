<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="wbTitle wbDesc">
  <title id="wbTitle">Three boundaries that protect work-life balance</title>
  <desc id="wbDesc">Three boundary types shown side by side: time boundaries defining when work starts and stops, space boundaries separating where work happens, and attention boundaries controlling notifications and availability.</desc>
  <rect width="800" height="380" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Balance is built from boundaries, not willpower</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif">
    <rect x="56" y="80" width="216" height="178" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <circle cx="164" cy="128" r="28" fill="#7C3AED"/>
    <path d="M164 112 v18 l12 8" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="164" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">TIME</text>
    <text x="164" y="210" text-anchor="middle" font-size="12" fill="#64748B">A defined start and stop,</text>
    <text x="164" y="228" text-anchor="middle" font-size="12" fill="#64748B">and a closing routine</text>
    <text x="164" y="248" text-anchor="middle" font-size="11" fill="#94A3B8">Stated out loud, not assumed</text>

    <rect x="292" y="80" width="216" height="178" rx="16" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3"/>
    <rect x="372" y="104" width="56" height="48" rx="6" fill="#06B6D4"/>
    <rect x="382" y="152" width="36" height="8" rx="3" fill="#06B6D4"/>
    <text x="400" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#0E7490">SPACE</text>
    <text x="400" y="210" text-anchor="middle" font-size="12" fill="#64748B">A spot used for work</text>
    <text x="400" y="228" text-anchor="middle" font-size="12" fill="#64748B">and nothing else</text>
    <text x="400" y="248" text-anchor="middle" font-size="11" fill="#94A3B8">A corner counts; a room is a bonus</text>

    <rect x="528" y="80" width="216" height="178" rx="16" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
    <circle cx="636" cy="128" r="28" fill="#F97316"/>
    <path d="M624 128 h24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="636" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#C2410C">ATTENTION</text>
    <text x="636" y="210" text-anchor="middle" font-size="12" fill="#64748B">Notifications off outside</text>
    <text x="636" y="228" text-anchor="middle" font-size="12" fill="#64748B">agreed hours</text>
    <text x="636" y="248" text-anchor="middle" font-size="11" fill="#94A3B8">Availability is a choice, not a default</text>
  </g>

  <text x="400" y="306" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Work expands into whatever is left undefined, which is why unstated limits disappear first.</text>
  <text x="400" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Review these as your role and circumstances change</text>
</svg>
