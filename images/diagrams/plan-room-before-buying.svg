<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="dcTitle dcDesc">
  <title id="dcTitle">Plan a room before buying decor</title>
  <desc id="dcDesc">A four step planning order for decorating: measure the room and existing furniture, choose a limited palette, select one anchor piece, then layer in lighting, textiles and accessories last.</desc>
  <rect width="800" height="380" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Buying first is what creates mismatched rooms</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif">
    <rect x="52" y="84" width="164" height="150" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <circle cx="134" cy="122" r="24" fill="#7C3AED"/>
    <text x="134" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <text x="134" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Measure</text>
    <text x="134" y="194" text-anchor="middle" font-size="12" fill="#64748B">Room, doorways</text>
    <text x="134" y="212" text-anchor="middle" font-size="12" fill="#64748B">and what you keep</text>

    <rect x="244" y="84" width="164" height="150" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3"/>
    <circle cx="326" cy="122" r="24" fill="#06B6D4"/>
    <text x="326" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <text x="326" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Set a palette</text>
    <text x="326" y="194" text-anchor="middle" font-size="12" fill="#64748B">Two base tones</text>
    <text x="326" y="212" text-anchor="middle" font-size="12" fill="#64748B">and one accent</text>

    <rect x="436" y="84" width="164" height="150" rx="14" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
    <circle cx="518" cy="122" r="24" fill="#F97316"/>
    <text x="518" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <text x="518" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Choose an anchor</text>
    <text x="518" y="194" text-anchor="middle" font-size="12" fill="#64748B">Rug, sofa or artwork</text>
    <text x="518" y="212" text-anchor="middle" font-size="12" fill="#64748B">everything else follows</text>

    <rect x="628" y="84" width="164" height="150" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <circle cx="710" cy="122" r="24" fill="#10B981"/>
    <text x="710" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
    <text x="710" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Layer last</text>
    <text x="710" y="194" text-anchor="middle" font-size="12" fill="#64748B">Lighting, textiles,</text>
    <text x="710" y="212" text-anchor="middle" font-size="12" fill="#64748B">plants, accessories</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M220 159 h20"/><path d="M412 159 h20"/><path d="M604 159 h20"/>
  </g>

  <text x="400" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Rooms that look unplanned usually were. Each purchase made sense alone, but none were chosen against a plan.</text>
  <text x="400" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Decide the palette before the first purchase, not after the third</text>
</svg>
