<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="plTitle plDesc">
  <title id="plTitle">Indoor plant light map by window direction</title>
  <desc id="plDesc">A plan view of a room showing the light each window direction receives in the northern hemisphere: south windows give the brightest and longest light, east gives gentle morning sun, west gives strong afternoon sun and heat, and north gives steady low light.</desc>
  <rect width="800" height="420" fill="#F8F7FF"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Match the plant to the window it will actually sit near</text>

  <rect x="280" y="120" width="240" height="180" rx="14" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="3"/>
  <text x="400" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="15" fill="#94A3B8">Room</text>
  <text x="400" y="224" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" fill="#CBD5E1">Northern hemisphere</text>

  <!-- North -->
  <rect x="330" y="104" width="140" height="10" rx="5" fill="#94A3B8"/>
  <text x="400" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#475569">NORTH &#8212; low, steady light</text>
  <text x="400" y="68" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Ferns, pothos, snake plant</text>

  <!-- South -->
  <rect x="330" y="306" width="140" height="10" rx="5" fill="#F97316"/>
  <text x="400" y="338" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#C2410C">SOUTH &#8212; brightest, longest light</text>
  <text x="400" y="358" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Succulents, cacti, herbs</text>

  <!-- East -->
  <rect x="266" y="170" width="10" height="80" rx="5" fill="#06B6D4"/>
  <text x="140" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#0E7490">EAST</text>
  <text x="140" y="218" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Gentle morning sun</text>
  <text x="140" y="238" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Most foliage plants</text>

  <!-- West -->
  <rect x="524" y="170" width="10" height="80" rx="5" fill="#EC4899"/>
  <text x="660" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#BE185D">WEST</text>
  <text x="660" y="218" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Strong afternoon sun</text>
  <text x="660" y="238" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">Watch for leaf scorch</text>

  <text x="400" y="398" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Light falls away quickly with distance, so a plant two metres from a window sits in far weaker light than one on the sill.</text>
</svg>
