<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="itTitle itDesc">
  <title id="itTitle">Transport options for travelling within India</title>
  <desc id="itDesc">A comparison of transport options in India plotted from cheapest and slowest to fastest and most expensive: local buses, sleeper class trains, air conditioned train classes, intercity coaches, and domestic flights.</desc>
  <rect width="800" height="380" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Cost, time and comfort rarely improve together</text>

  <line x1="90" y1="280" x2="730" y2="280" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="90" y1="80" x2="90" y2="280" stroke="#CBD5E1" stroke-width="3"/>
  <text x="60" y="96" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#64748B" transform="rotate(-90 60 96)">Cost</text>
  <text x="400" y="312" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#64748B">Journey time &#8212; longer to the left, shorter to the right</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif">
    <circle cx="160" cy="248" r="26" fill="#10B981"/>
    <text x="160" y="253" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">BUS</text>
    <text x="160" y="196" text-anchor="middle" font-size="11" fill="#64748B">Local and state</text>
    <text x="160" y="212" text-anchor="middle" font-size="11" fill="#64748B">buses</text>

    <circle cx="298" cy="224" r="28" fill="#06B6D4"/>
    <text x="298" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">SLEEPER</text>
    <text x="298" y="236" text-anchor="middle" font-size="10" fill="#ECFEFF">class</text>
    <text x="298" y="168" text-anchor="middle" font-size="11" fill="#64748B">Best value over</text>
    <text x="298" y="184" text-anchor="middle" font-size="11" fill="#64748B">long distances</text>

    <circle cx="428" cy="186" r="28" fill="#7C3AED"/>
    <text x="428" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">AC TRAIN</text>
    <text x="428" y="198" text-anchor="middle" font-size="10" fill="#DDD6FE">3A / 2A</text>
    <text x="428" y="130" text-anchor="middle" font-size="11" fill="#64748B">Comfortable and</text>
    <text x="428" y="146" text-anchor="middle" font-size="11" fill="#64748B">still affordable</text>

    <circle cx="552" cy="204" r="26" fill="#F59E0B"/>
    <text x="552" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">COACH</text>
    <text x="552" y="216" text-anchor="middle" font-size="10" fill="#FFFBEB">intercity</text>
    <text x="552" y="150" text-anchor="middle" font-size="11" fill="#64748B">Useful where trains</text>
    <text x="552" y="166" text-anchor="middle" font-size="11" fill="#64748B">are booked out</text>

    <circle cx="676" cy="122" r="28" fill="#EC4899"/>
    <text x="676" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">FLIGHT</text>
    <text x="676" y="76" text-anchor="middle" font-size="11" fill="#64748B">Fastest, but add</text>
    <text x="676" y="92" text-anchor="middle" font-size="11" fill="#64748B">airport transfers</text>
  </g>

  <text x="400" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#94A3B8">Indicative positions only. Fares vary by route, class, season and how far ahead you book.</text>
</svg>
