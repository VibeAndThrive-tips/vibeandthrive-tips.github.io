<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="vtTitle vtDesc">
  <title id="vtTitle">Visual tricks that make a small room feel larger</title>
  <desc id="vtDesc">Four techniques that change how large a room feels without changing its size: raising furniture on legs to show floor, keeping sightlines to windows clear, drawing the eye upward with vertical lines, and using mirrors to reflect light.</desc>
  <rect width="800" height="400" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">The room stays the same size; it just stops feeling small</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif">
    <rect x="52" y="74" width="164" height="196" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="86" y="122" width="96" height="40" rx="6" fill="#7C3AED"/>
    <g stroke="#7C3AED" stroke-width="4" stroke-linecap="round"><path d="M96 162 v18"/><path d="M172 162 v18"/></g>
    <line x1="72" y1="182" x2="196" y2="182" stroke="#CBD5E1" stroke-width="3"/>
    <text x="134" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Raise it on legs</text>
    <text x="134" y="234" text-anchor="middle" font-size="12" fill="#64748B">Visible floor under</text>
    <text x="134" y="252" text-anchor="middle" font-size="12" fill="#64748B">furniture reads as space</text>

    <rect x="244" y="74" width="164" height="196" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3"/>
    <rect x="352" y="112" width="40" height="56" rx="4" fill="#E0F2FE" stroke="#06B6D4" stroke-width="3"/>
    <path d="M262 168 h84" stroke="#06B6D4" stroke-width="4" stroke-dasharray="7 5" stroke-linecap="round"/>
    <text x="326" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Keep sightlines clear</text>
    <text x="326" y="234" text-anchor="middle" font-size="12" fill="#64748B">An unobstructed view</text>
    <text x="326" y="252" text-anchor="middle" font-size="12" fill="#64748B">to a window adds depth</text>

    <rect x="436" y="74" width="164" height="196" rx="14" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
    <g stroke="#F97316" stroke-width="4" stroke-linecap="round">
      <path d="M486 112 v70"/><path d="M518 106 v76"/><path d="M550 112 v70"/>
    </g>
    <text x="518" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Draw the eye upward</text>
    <text x="518" y="234" text-anchor="middle" font-size="12" fill="#64748B">Tall curtains and vertical</text>
    <text x="518" y="252" text-anchor="middle" font-size="12" fill="#64748B">lines raise the ceiling</text>

    <rect x="628" y="74" width="164" height="196" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <rect x="682" y="108" width="56" height="74" rx="26" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
    <path d="M694 128 l12 -12" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <text x="710" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Reflect the light</text>
    <text x="710" y="234" text-anchor="middle" font-size="12" fill="#64748B">A mirror opposite a</text>
    <text x="710" y="252" text-anchor="middle" font-size="12" fill="#64748B">window doubles brightness</text>
  </g>

  <text x="400" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Perceived space depends on how much floor, light and distance the eye can read, not on square metres alone.</text>
  <text x="400" y="362" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Fewer, larger pieces feel roomier than many small ones</text>
</svg>
