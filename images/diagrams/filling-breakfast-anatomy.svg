<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="bkTitle bkDesc">
  <title id="bkTitle">The anatomy of a breakfast that keeps you full</title>
  <desc id="bkDesc">A plate divided into four components that make a breakfast filling: protein, fibre, healthy fat and a slower carbohydrate, contrasted with a carbohydrate-only breakfast that digests quickly and leaves you hungry sooner.</desc>
  <rect width="800" height="400" fill="#F8F7FF"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Fullness comes from what you combine, not the calories</text>

  <circle cx="250" cy="196" r="108" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="3"/>
  <path d="M250 196 L250 88 A108 108 0 0 1 358 196 Z" fill="#7C3AED" opacity="0.85"/>
  <path d="M250 196 L358 196 A108 108 0 0 1 250 304 Z" fill="#10B981" opacity="0.85"/>
  <path d="M250 196 L250 304 A108 108 0 0 1 142 196 Z" fill="#F97316" opacity="0.85"/>
  <path d="M250 196 L142 196 A108 108 0 0 1 250 88 Z" fill="#06B6D4" opacity="0.85"/>
  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
    <text x="300" y="146" text-anchor="middle">PROTEIN</text>
    <text x="300" y="250" text-anchor="middle">FIBRE</text>
    <text x="200" y="250" text-anchor="middle">FAT</text>
    <text x="200" y="146" text-anchor="middle">CARB</text>
  </g>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#64748B">
    <text x="410" y="118" font-weight="700" fill="#5B21B6">Protein</text>
    <text x="410" y="140">Eggs, curd, paneer, dal, nuts</text>
    <text x="410" y="176" font-weight="700" fill="#047857">Fibre</text>
    <text x="410" y="198">Fruit, vegetables, whole grains</text>
    <text x="410" y="234" font-weight="700" fill="#C2410C">Healthy fat</text>
    <text x="410" y="256">Nuts, seeds, ghee, olive oil</text>
    <text x="410" y="292" font-weight="700" fill="#0E7490">Slower carbohydrate</text>
    <text x="410" y="314">Oats, whole wheat, millet, poha</text>
  </g>

  <text x="400" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">A carbohydrate-only breakfast digests quickly, which is why toast or cereal alone often leaves you hungry by mid-morning.</text>
  <text x="400" y="384" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" fill="#94A3B8">General guidance only, not individual dietary advice.</text>
</svg>
