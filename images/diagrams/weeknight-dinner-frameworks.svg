<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="wnTitle wnDesc">
  <title id="wnTitle">Five repeatable weeknight dinner frameworks</title>
  <desc id="wnDesc">Five dinner patterns that remove the nightly decision of what to cook: stir fry, sheet pan, one pot, assembly plate, and breakfast for dinner, each with the basic formula it follows.</desc>
  <rect width="800" height="380" fill="#F8F7FF"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Pick a pattern, then decide ingredients</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif">
    <rect x="48" y="72" width="140" height="176" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="48" y="72" width="140" height="40" rx="14" fill="#7C3AED"/>
    <text x="118" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">STIR FRY</text>
    <text x="118" y="140" text-anchor="middle" font-size="12" fill="#64748B">Protein</text>
    <text x="118" y="162" text-anchor="middle" font-size="12" fill="#64748B">+ fast veg</text>
    <text x="118" y="184" text-anchor="middle" font-size="12" fill="#64748B">+ sauce</text>
    <text x="118" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">High heat, minutes</text>

    <rect x="200" y="72" width="140" height="176" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3"/>
    <rect x="200" y="72" width="140" height="40" rx="14" fill="#06B6D4"/>
    <text x="270" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">SHEET PAN</text>
    <text x="270" y="140" text-anchor="middle" font-size="12" fill="#64748B">Everything on</text>
    <text x="270" y="162" text-anchor="middle" font-size="12" fill="#64748B">one tray,</text>
    <text x="270" y="184" text-anchor="middle" font-size="12" fill="#64748B">oven does the work</text>
    <text x="270" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#0E7490">Hands off</text>

    <rect x="352" y="72" width="140" height="176" rx="14" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
    <rect x="352" y="72" width="140" height="40" rx="14" fill="#F97316"/>
    <text x="422" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">ONE POT</text>
    <text x="422" y="140" text-anchor="middle" font-size="12" fill="#64748B">Starch cooks</text>
    <text x="422" y="162" text-anchor="middle" font-size="12" fill="#64748B">in the sauce</text>
    <text x="422" y="184" text-anchor="middle" font-size="12" fill="#64748B">or stock</text>
    <text x="422" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">Least washing up</text>

    <rect x="504" y="72" width="140" height="176" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <rect x="504" y="72" width="140" height="40" rx="14" fill="#10B981"/>
    <text x="574" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">ASSEMBLY</text>
    <text x="574" y="140" text-anchor="middle" font-size="12" fill="#64748B">Prepped parts</text>
    <text x="574" y="162" text-anchor="middle" font-size="12" fill="#64748B">combined cold</text>
    <text x="574" y="184" text-anchor="middle" font-size="12" fill="#64748B">or barely warmed</text>
    <text x="574" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">No real cooking</text>

    <rect x="656" y="72" width="140" height="176" rx="14" fill="#FFFFFF" stroke="#EC4899" stroke-width="3"/>
    <rect x="656" y="72" width="140" height="40" rx="14" fill="#EC4899"/>
    <text x="726" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">BREAKFAST</text>
    <text x="726" y="140" text-anchor="middle" font-size="12" fill="#64748B">Eggs, toast,</text>
    <text x="726" y="162" text-anchor="middle" font-size="12" fill="#64748B">pancakes,</text>
    <text x="726" y="184" text-anchor="middle" font-size="12" fill="#64748B">upma or poha</text>
    <text x="726" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#BE185D">Always in the house</text>
  </g>

  <text x="400" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Assigning one framework to each weeknight turns dinner into a slot to fill rather than a question to answer.</text>
  <text x="400" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Five frameworks cover a full working week</text>
</svg>
