<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="pkTitle pkDesc">
  <title id="pkTitle">Folded stacks compared with rolled clothing in a suitcase</title>
  <desc id="pkDesc">Two suitcase views showing that flat folded stacks leave gaps and hide lower layers, while rolled items stand upright in rows so every item stays visible and small gaps can be filled.</desc>
  <rect width="800" height="400" fill="#F8F7FF"/>

  <text x="200" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#0F0A1E">Folded in flat stacks</text>
  <rect x="64" y="64" width="272" height="196" rx="16" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="3"/>
  <g fill="#94A3B8" opacity="0.85">
    <rect x="88" y="90" width="224" height="26" rx="5"/>
    <rect x="88" y="124" width="224" height="26" rx="5"/>
    <rect x="88" y="158" width="224" height="26" rx="5"/>
    <rect x="88" y="192" width="180" height="26" rx="5"/>
  </g>
  <rect x="272" y="192" width="40" height="26" rx="5" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="200" y="292" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Lower layers are hidden, so finding one</text>
  <text x="200" y="312" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">item disturbs everything above it.</text>
  <text x="200" y="346" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#BE185D">Gaps go unused</text>

  <line x1="400" y1="64" x2="400" y2="330" stroke="#EDE9FE" stroke-width="3"/>

  <text x="600" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#0F0A1E">Rolled and stood upright</text>
  <rect x="464" y="64" width="272" height="196" rx="16" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="3"/>
  <g fill="#7C3AED" opacity="0.88">
    <rect x="486" y="90" width="26" height="150" rx="10"/>
    <rect x="520" y="90" width="26" height="150" rx="10"/>
    <rect x="554" y="90" width="26" height="150" rx="10"/>
    <rect x="588" y="90" width="26" height="150" rx="10"/>
    <rect x="622" y="90" width="26" height="150" rx="10"/>
    <rect x="656" y="90" width="26" height="150" rx="10"/>
  </g>
  <g fill="#F97316" opacity="0.9">
    <rect x="690" y="90" width="18" height="70" rx="7"/>
    <rect x="690" y="168" width="18" height="72" rx="7"/>
  </g>
  <text x="600" y="292" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Every item is visible from above and can be</text>
  <text x="600" y="312" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">removed without unpacking the rest.</text>
  <text x="600" y="346" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#5B21B6">Small gaps take socks and chargers</text>

  <text x="400" y="384" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" fill="#94A3B8">Rolling suits soft knits and casual clothing; structured shirts and jackets still travel better folded or in a garment sleeve.</text>
</svg>
