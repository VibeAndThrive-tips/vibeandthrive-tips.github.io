<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="upTitle upDesc">
  <title id="upTitle">The upcycling workflow from find to finish</title>
  <desc id="upDesc">A five stage upcycling workflow: assess whether the piece is structurally sound, clean it thoroughly, repair and sand, prime the surface, then apply the finish and protective coat.</desc>
  <rect width="800" height="360" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">Most of the result is decided before any paint opens</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif">
    <rect x="44" y="82" width="136" height="132" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <circle cx="112" cy="116" r="22" fill="#7C3AED"/><text x="112" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
    <text x="112" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#0F0A1E">Assess</text>
    <text x="112" y="180" text-anchor="middle" font-size="11" fill="#64748B">Is the structure</text>
    <text x="112" y="196" text-anchor="middle" font-size="11" fill="#64748B">actually sound?</text>

    <rect x="196" y="82" width="136" height="132" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3"/>
    <circle cx="264" cy="116" r="22" fill="#06B6D4"/><text x="264" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="264" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#0F0A1E">Clean</text>
    <text x="264" y="180" text-anchor="middle" font-size="11" fill="#64748B">Grease and dust</text>
    <text x="264" y="196" text-anchor="middle" font-size="11" fill="#64748B">stop paint sticking</text>

    <rect x="348" y="82" width="136" height="132" rx="14" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
    <circle cx="416" cy="116" r="22" fill="#F97316"/><text x="416" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="416" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#0F0A1E">Repair and sand</text>
    <text x="416" y="180" text-anchor="middle" font-size="11" fill="#64748B">Fill, tighten,</text>
    <text x="416" y="196" text-anchor="middle" font-size="11" fill="#64748B">smooth the surface</text>

    <rect x="500" y="82" width="136" height="132" rx="14" fill="#FFFFFF" stroke="#EC4899" stroke-width="3"/>
    <circle cx="568" cy="116" r="22" fill="#EC4899"/><text x="568" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
    <text x="568" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#0F0A1E">Prime</text>
    <text x="568" y="180" text-anchor="middle" font-size="11" fill="#64748B">The step most</text>
    <text x="568" y="196" text-anchor="middle" font-size="11" fill="#64748B">beginners skip</text>

    <rect x="652" y="82" width="136" height="132" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <circle cx="720" cy="116" r="22" fill="#10B981"/><text x="720" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
    <text x="720" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#0F0A1E">Finish</text>
    <text x="720" y="180" text-anchor="middle" font-size="11" fill="#64748B">Thin coats, then</text>
    <text x="720" y="196" text-anchor="middle" font-size="11" fill="#64748B">a protective seal</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M184 148 h8"/><path d="M336 148 h8"/><path d="M488 148 h8"/><path d="M640 148 h8"/>
  </g>

  <text x="400" y="268" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">A sound piece prepared properly and painted simply will always beat a damaged piece painted beautifully.</text>
  <text x="400" y="312" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Work in a ventilated space &#183; Check older paint and finishes before sanding</text>
</svg>
