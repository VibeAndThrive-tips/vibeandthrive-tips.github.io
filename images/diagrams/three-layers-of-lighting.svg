<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="ltTitle ltDesc">
  <title id="ltTitle">The three layers of room lighting</title>
  <desc id="ltDesc">A room cross-section showing ambient lighting from the ceiling for overall brightness, task lighting at desk height for focused work, and accent lighting on a wall to add depth.</desc>
  <rect width="800" height="400" fill="#F8F7FF"/>
  <rect x="70" y="50" width="660" height="280" rx="18" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="3"/>

  <!-- Ambient -->
  <path d="M400 70 L300 190 L500 190 Z" fill="#7C3AED" opacity="0.14"/>
  <rect x="372" y="62" width="56" height="12" rx="6" fill="#7C3AED"/>
  <circle cx="400" cy="86" r="9" fill="#7C3AED" opacity="0.55"/>
  <text x="400" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#5B21B6">1. Ambient</text>
  <text x="400" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Overall background brightness</text>

  <!-- Task -->
  <path d="M190 196 L150 268 L246 268 Z" fill="#06B6D4" opacity="0.16"/>
  <rect x="150" y="268" width="110" height="10" rx="5" fill="#94A3B8"/>
  <path d="M196 196 v-34 h-34" stroke="#06B6D4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="190" cy="198" r="9" fill="#06B6D4"/>
  <text x="205" y="306" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#0E7490">2. Task</text>
  <text x="205" y="326" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Focused light where you work</text>

  <!-- Accent -->
  <path d="M640 180 q-52 46 0 92 z" fill="#F97316" opacity="0.18"/>
  <rect x="636" y="176" width="10" height="100" rx="5" fill="#F97316"/>
  <rect x="592" y="196" width="44" height="60" rx="6" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="3"/>
  <text x="620" y="306" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#C2410C">3. Accent</text>
  <text x="620" y="326" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Highlights art, shelves, texture</text>

  <!-- Floor -->
  <line x1="70" y1="330" x2="730" y2="330" stroke="#EDE9FE" stroke-width="4"/>
  <text x="400" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="15" fill="#64748B">Using all three layers together is what makes a room feel finished rather than flat.</text>
</svg>
