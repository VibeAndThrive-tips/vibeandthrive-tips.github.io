<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="ddTitle ddDesc">
  <title id="ddTitle">Furniture that earns its place in a small Indian apartment</title>
  <desc id="ddDesc">Four examples of double-duty furniture suited to compact homes: a storage bed, a folding or wall-mounted dining table, a seating chest with hidden storage, and vertical shelving that uses wall height rather than floor area.</desc>
  <rect width="800" height="400" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">In a compact home, every piece should do two jobs</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif">
    <rect x="52" y="76" width="164" height="190" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="76" y="118" width="116" height="34" rx="6" fill="#7C3AED"/>
    <rect x="76" y="152" width="116" height="34" rx="4" fill="#DDD6FE" stroke="#7C3AED" stroke-width="2"/>
    <line x1="134" y1="152" x2="134" y2="186" stroke="#7C3AED" stroke-width="2"/>
    <text x="134" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Storage bed</text>
    <text x="134" y="238" text-anchor="middle" font-size="12" fill="#64748B">Replaces an entire</text>
    <text x="134" y="256" text-anchor="middle" font-size="12" fill="#64748B">cupboard of space</text>

    <rect x="244" y="76" width="164" height="190" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3"/>
    <rect x="272" y="120" width="10" height="66" fill="#06B6D4"/>
    <rect x="272" y="120" width="108" height="10" rx="4" fill="#06B6D4"/>
    <path d="M330 130 v46" stroke="#06B6D4" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="326" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Folding table</text>
    <text x="326" y="238" text-anchor="middle" font-size="12" fill="#64748B">Dining surface that</text>
    <text x="326" y="256" text-anchor="middle" font-size="12" fill="#64748B">disappears after meals</text>

    <rect x="436" y="76" width="164" height="190" rx="14" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
    <rect x="466" y="134" width="104" height="52" rx="8" fill="#F97316"/>
    <rect x="466" y="126" width="104" height="14" rx="6" fill="#FDBA74"/>
    <text x="518" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Seating with storage</text>
    <text x="518" y="238" text-anchor="middle" font-size="12" fill="#64748B">A bench, diwan or chest</text>
    <text x="518" y="256" text-anchor="middle" font-size="12" fill="#64748B">that opens up</text>

    <rect x="628" y="76" width="164" height="190" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <g fill="#10B981">
      <rect x="678" y="112" width="64" height="9" rx="4"/>
      <rect x="678" y="136" width="64" height="9" rx="4"/>
      <rect x="678" y="160" width="64" height="9" rx="4"/>
      <rect x="678" y="184" width="64" height="9" rx="4"/>
    </g>
    <text x="710" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0F0A1E">Vertical shelving</text>
    <text x="710" y="238" text-anchor="middle" font-size="12" fill="#64748B">Height is the space</text>
    <text x="710" y="256" text-anchor="middle" font-size="12" fill="#64748B">most homes waste</text>
  </g>

  <text x="400" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">Floor area is the scarce resource. Anything that stores, folds away or builds upward returns some of it.</text>
  <text x="400" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Measure doorways and lifts before ordering anything large</text>
</svg>
