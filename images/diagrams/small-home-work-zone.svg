<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="wfhTitle wfhDesc">
  <title id="wfhTitle">Setting up a work zone in a small Indian home</title>
  <desc id="wfhDesc">A compact home layout showing a defined work corner positioned near natural light and a power point, facing away from the main walkway, with a backup power bank and mobile hotspot kept within reach.</desc>
  <rect width="800" height="380" fill="#F8F7FF"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0F0A1E">A defined corner beats a large but shared table</text>

  <rect x="150" y="70" width="380" height="220" rx="14" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="3"/>

  <rect x="166" y="86" width="150" height="86" rx="10" fill="#7C3AED" opacity="0.14"/>
  <rect x="180" y="118" width="110" height="12" rx="4" fill="#7C3AED"/>
  <rect x="216" y="130" width="38" height="28" rx="4" fill="#7C3AED" opacity="0.5"/>
  <text x="241" y="106" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5B21B6">WORK ZONE</text>

  <rect x="140" y="96" width="10" height="60" rx="4" fill="#06B6D4"/>
  <text x="128" y="92" text-anchor="end" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0E7490">Window</text>
  <text x="128" y="112" text-anchor="end" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="11" fill="#64748B">Light from the side,</text>
  <text x="128" y="128" text-anchor="end" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="11" fill="#64748B">not behind the screen</text>

  <rect x="322" y="126" width="14" height="14" rx="3" fill="#F97316"/>
  <text x="346" y="138" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#C2410C">Power point within reach</text>

  <path d="M170 250 h340" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="340" y="272" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" fill="#94A3B8">Main walkway &#8212; keep the desk out of it</text>

  <rect x="380" y="180" width="130" height="56" rx="10" fill="#10B981" opacity="0.15"/>
  <text x="445" y="204" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#047857">BACKUP KIT</text>
  <text x="445" y="224" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="11" fill="#64748B">Power bank, hotspot</text>

  <g font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="12" fill="#64748B">
    <text x="556" y="104" font-weight="700" fill="#5B21B6">Signal the boundary</text>
    <text x="556" y="126">Headphones on means</text>
    <text x="556" y="144">working, so family need</text>
    <text x="556" y="162">not guess</text>

    <text x="556" y="200" font-weight="700" fill="#C2410C">Plan for outages</text>
    <text x="556" y="222">A charged power bank and</text>
    <text x="556" y="240">mobile data turn an outage</text>
    <text x="556" y="258">into an inconvenience</text>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="14" fill="#64748B">The corner does not need to be big. It needs to be consistent, so starting and stopping work both have a place.</text>
  <text x="400" y="364" text-anchor="middle" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#047857">Same seat each day &#183; Packed away at the end</text>
</svg>
